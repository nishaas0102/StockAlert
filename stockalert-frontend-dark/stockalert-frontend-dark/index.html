<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockAlert ⚡ Neon Inventory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div id="glow"></div>

  <header class="hero">
    <div class="brand">
      <span class="logo">🚀</span>
      <div><h1>STOCK<em>⚡</em>ALERT</h1><p>Inventory command center · <span id="clock"></span></p></div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="products">🛍️ Products</button>
      <button class="tab" data-tab="movements">🔄 Movements</button>
      <button class="tab" data-tab="alerts">🚨 Alerts</button>
    </nav>
  </header>

  <main>
    <section class="stats">
      <div class="stat s1"><span>📦</span><div><b id="stTotal">0</b><small>Total Products</small></div></div>
      <div class="stat s2"><span>⚠️</span><div><b id="stLow">0</b><small>Low Stock</small></div></div>
      <div class="stat s3"><span>🔔</span><div><b id="stAlerts">0</b><small>Open Alerts</small></div></div>
      <div class="stat s4"><span>🔄</span><div><b id="stMoves">0</b><small>Stock Movements</small></div></div>
    </section>

    <section id="tab-products" class="panel">
      <div class="toolbar">
        <input id="fKeyword" placeholder="🔍 Search name or SKU">
        <input id="fCategory" placeholder="🏷️ Category">
        <label class="check"><input type="checkbox" id="fLow"> 🔥 Low stock only</label>
        <button class="btn primary" id="btnAdd">＋ Add Product</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th data-sort="name">Name ⇅</th><th data-sort="sku">SKU ⇅</th><th data-sort="category">Category ⇅</th>
          <th data-sort="quantity">Stock ⇅</th><th data-sort="reorderLevel">Reorder ⇅</th><th data-sort="price">Price ⇅</th>
          <th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="productBody"></tbody>
      </table></div>
      <div class="pager" id="productPager"></div>
    </section>

    <section id="tab-movements" class="panel hidden">
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Note</th></tr></thead>
        <tbody id="moveBody"></tbody>
      </table></div>
      <div class="pager" id="movePager"></div>
    </section>

    <section id="tab-alerts" class="panel hidden">
      <div class="toolbar">
        <select id="fResolved">
          <option value="false">🚨 Open alerts</option>
          <option value="true">✅ Resolved alerts</option>
          <option value="">📋 All alerts</option>
        </select>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Product</th><th>SKU</th><th>Qty</th><th>Reorder Level</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="alertBody"></tbody>
      </table></div>
      <div class="pager" id="alertPager"></div>
    </section>
  </main>

  <div id="overlay" class="overlay hidden"><div class="modal" id="modal"></div></div>
  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
